name: Draft release
on:
  push:
    tags: ['[0-9]*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:preflight
      - name: Verify tag matches manifest
        run: node -e 'if (JSON.parse(require("fs").readFileSync("manifest.json")).version !== process.env.GITHUB_REF_NAME) process.exit(1)'
      - run: npm run check
      - name: Verify generated styles are committed
        run: git diff --exit-code -- styles.css
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Qiaomu Agent $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" main.js manifest.json styles.css
